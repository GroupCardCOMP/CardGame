name: Build desktop packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package: dmg
          - os: windows-latest
            package: exe
          - os: ubuntu-latest
            package: deb

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Linux packaging dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot

      - name: Build game
        if: runner.os != 'Windows'
        run: ./gradlew clean build

      - name: Build game on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat clean build

      - name: Create output directory
        run: mkdir dist

      - name: Package app
        run: jpackage --type ${{ matrix.package }} --name CardGame --input build/libs --main-jar CardGame.jar --main-class main.MainClass --dest dist --app-version 1.0.0

      - uses: actions/upload-artifact@v4
        with:
          name: CardGame-${{ runner.os }}
          path: dist/*